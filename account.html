<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>FRIX — Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account" data-lang="sq">

<div class="app-shell">
    <header class="app-header">
        <div class="header-brand">
            <img src="img/frix-logo.png" alt="FRIX" class="logo-img">
            <div>
                <span class="logo-word">FRIX</span>
                <span class="logo-tag" data-i18n="logoTag">POTATO GANG</span>
            </div>
        </div>
        <div class="header-actions">
            <button type="button" class="lang-toggle" id="langToggle" aria-label="Language">
                <span class="lang-option active" data-lang="sq">SQ</span>
                <span class="lang-divider">|</span>
                <span class="lang-option" data-lang="en">EN</span>
            </button>
            <div class="points-pill">
                <span class="coin">●</span>
                <span id="pointsDisplay">860</span>
            </div>
        </div>
    </header>

    <main class="app-main">
        <section class="account-page">
            <div class="profile-header">
                <div class="avatar">A</div>
                <div>
                    <h1>Altin M.</h1>
                    <span class="member-since" data-i18n="memberSince">Anëtar që nga 2026</span>
                </div>
            </div>

            <div class="account-stats">
                <div class="stat-box">
                    <span class="stat-value">860</span>
                    <span class="stat-label" data-i18n="totalPoints">Pikat</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value">14</span>
                    <span class="stat-label" data-i18n="totalVisits">Vizita</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value">4</span>
                    <span class="stat-label" data-i18n="freeDrinks">Pije falas</span>
                </div>
            </div>

            <div class="account-section">
                <h2 data-i18n="personalInfo">Të dhënat personale</h2>
                <div class="info-list">
                    <div class="info-row">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 8l8 5 8-5"/></svg>
                        <div>
                            <span data-i18n="email">Email</span>
                            <strong>altin@example.com</strong>
                        </div>
                    </div>
                    <div class="info-row">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                        <div>
                            <span data-i18n="phone">Telefon</span>
                            <strong>+383 44 123 456</strong>
                        </div>
                    </div>
                    <div class="info-row">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-4.5 7-11a7 7 0 10-14 0c0 6.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
                        <div>
                            <span data-i18n="mainStore">Lokali kryesor</span>
                            <strong>Prishtina Mall</strong>
                        </div>
                    </div>
                </div>
            </div>

            <div class="account-section">
                <h2 data-i18n="language">Gjuha</h2>
                <div class="lang-select">
                    <button type="button" class="lang-btn selected" data-set-lang="sq" data-i18n="langSq">Shqip</button>
                    <button type="button" class="lang-btn" data-set-lang="en" data-i18n="langEn">English</button>
                </div>
            </div>

            <div class="account-section">
                <h2 data-i18n="notifications">Njoftimet</h2>
                <div class="toggle-list">
                    <label class="toggle-row">
                        <div>
                            <strong data-i18n="pushNotif">Njoftime push</strong>
                            <span data-i18n="pushDesc">Oferta dhe Potato Gang deals</span>
                        </div>
                        <input type="checkbox" class="toggle-input" checked>
                        <span class="toggle-switch"></span>
                    </label>
                    <label class="toggle-row">
                        <div>
                            <strong data-i18n="emailNotif">Email</strong>
                            <span data-i18n="emailDesc">Përmbledhje javore</span>
                        </div>
                        <input type="checkbox" class="toggle-input" checked>
                        <span class="toggle-switch"></span>
                    </label>
                </div>
            </div>

            <button type="button" class="btn-logout" data-i18n="logout">Dil</button>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Main">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
            <span data-i18n="navHome">Kryefaqja</span>
        </a>
        <a href="scan.html" class="nav-item nav-scan">
            <div class="scan-fab">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
            </div>
            <span data-i18n="navScan">Skano</span>
        </a>
        <a href="account.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <span data-i18n="navAccount">Llogaria</span>
        </a>
    </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
